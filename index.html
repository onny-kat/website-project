<html>

<head>
    <title>Website</title>
</head>

<body>
    <section class="hero">
        <div class="hero-content">
            <h1>Welcome to Our Site</h1>
            <p>We help you build great things fast and easy.</p>
            <a href="#signup" class="btn">Get Started</a>
        </div>
    </section>
    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
    <form action="/submit-form-endpoint" method="POST">

        <!-- Name Field -->
        <label for="user-name">Full Name:</label>
        <input type="text" id="user-name" name="name" required>

        <!-- Email Field -->
        <label for="user-email">Email Address:</label>
        <input type="email" id="user-email" name="email" required>

        <!-- Message Field -->
        <label for="user-message">Your Message:</label>
        <textarea id="user-message" name="message" rows="5" required></textarea>

        <!-- Submission Button -->
        <button type="submit">Send Message</button>

    </form>
    <h1>Welcome to Our Website</h1>
    <section class="testimonials">
        <h2>What Our Clients Say</h2>

        <div class="testimonial-grid">
            <!-- Single Testimonial Card -->
            <figure class="testimonial-card">
                <blockquote>
                    <p>"This service completely transformed our daily workflow. Highly recommended!"</p>
                </blockquote>
                <figcaption>
                    <img src="user-avatar.jpg" alt="Jane Doe" class="avatar">
                    <div class="author-info">
                        <cite class="author-name">Jane Doe</cite>
                        <span class="author-title">CEO, TechCorp</span>
                    </div>
                </figcaption>
            </figure>
        </div>
    </section>
    <footer>
        <p>&copy; 2025 My Website</p>
    </footer>
</body>

</html>
